<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NetCommute 20 - 네트워크관리사 CBT</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NetCommute20">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2885/2885417.png">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .bottom-sheet { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .bottom-sheet.hidden-sheet { transform: translateY(100%); }
    .bottom-sheet.show-sheet { transform: translateY(0); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto relative shadow-2xl bg-slate-900 border-x border-slate-800">

  <!-- 상단 네비게이션 -->
  <header class="p-4 border-b border-slate-800 flex items-center justify-between sticky top-0 bg-slate-900/90 backdrop-blur-md z-10">
    <div class="flex items-center gap-2 cursor-pointer" onclick="switchTab('dashboard')">
      <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-lg">N</div>
      <div>
        <h1 class="font-bold text-sm tracking-tight text-slate-100">NetCommute 20</h1>
        <p class="text-[10px] text-slate-400">통학 20분 마이크로 문제은행</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium flex items-center gap-1">
        <i data-lucide="flame" class="w-3.5 h-3.5"></i> <span id="streak-badge">1일 연속</span>
      </span>
    </div>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main id="app-content" class="p-4 flex-1 pb-24 overflow-y-auto">
    <!-- 동적 탭 렌더링 영역 -->
  </main>

  <!-- 하단 고정 탭 바 -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 backdrop-blur-md border-t border-slate-800 grid grid-cols-4 p-2 z-20">
    <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center py-1 text-emerald-400">
      <i data-lucide="play-circle" class="w-5 h-5"></i>
      <span class="text-[11px] mt-1 font-medium">챌린지</span>
    </button>
    <button onclick="switchTab('wrong')" id="nav-wrong" class="flex flex-col items-center py-1 text-slate-400 relative">
      <i data-lucide="book-open" class="w-5 h-5"></i>
      <span class="text-[11px] mt-1 font-medium">오답노트</span>
      <span id="wrong-count-badge" class="absolute top-0 right-5 w-4 h-4 bg-rose-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center hidden">0</span>
    </button>
    <button onclick="switchTab('subject')" id="nav-subject" class="flex flex-col items-center py-1 text-slate-400">
      <i data-lucide="layers" class="w-5 h-5"></i>
      <span class="text-[11px] mt-1 font-medium">과목별</span>
    </button>
    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center py-1 text-slate-400">
      <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
      <span class="text-[11px] mt-1 font-medium">대시보드</span>
    </button>
  </nav>

  <!-- 숏해설 슬라이딩 바텀 시트 -->
  <div id="explanation-sheet" class="bottom-sheet hidden-sheet fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-800 border-t border-slate-700 rounded-t-2xl p-5 shadow-2xl z-30 max-h-[75vh] overflow-y-auto">
    <div class="w-12 h-1 bg-slate-600 rounded-full mx-auto mb-4"></div>
    <div class="flex items-center justify-between mb-3">
      <span id="sheet-result-badge" class="text-xs font-bold px-2.5 py-1 rounded-full"></span>
      <button onclick="closeExplanation()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="mb-4">
      <h4 class="text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-1">💡 3초 핵심 요약</h4>
      <p id="sheet-short-exp" class="text-sm font-medium text-slate-100 bg-slate-900/60 p-3 rounded-lg border border-slate-700/50"></p>
    </div>
    <div class="mb-5">
      <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">상세 해설</h4>
      <p id="sheet-full-exp" class="text-xs text-slate-300 leading-relaxed"></p>
    </div>
    <button id="sheet-next-btn" onclick="nextQuestion()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl flex items-center justify-center gap-2">
      다음 문제로 <i data-lucide="arrow-right" class="w-4 h-4"></i>
    </button>
  </div>

  <script>
    // === 데이터베이스 (15문항) ===
    const sampleQuestions = [
      { id: "q1", subject: "TCP/IP", text: "IP Address 192.168.1.0/24 네트워크를 4개의 서브넷으로 나눌 때 서브넷 마스크는?", options: ["255.255.255.128", "255.255.255.192", "255.255.255.224", "255.255.255.240"], correct: 1, shortExp: "4개 서브넷 분할 시 호스트 비트 2개를 네트워크 비트로 사용 ➔ /26 (255.255.255.192)", fullExp: "/24에서 4개 서브넷으로 나누려면 2^2=4이므로 서브넷 비트를 2비트 늘려 /26이 됩니다. 128 + 64 = 192이므로 마지막 옥텟은 192가 됩니다." },
      { id: "q2", subject: "TCP/IP", text: "OSI 7계층 중 전송 계층(Transport Layer)에서 동작하는 프로토콜로 비연결성 패킷 통신을 제공하는 것은?", options: ["TCP", "UDP", "IP", "ARP"], correct: 1, shortExp: "UDP는 비연결성, 신뢰성 미보장, 빠른 속도의 전송계층 프로토콜입니다.", fullExp: "TCP는 연결지향성/신뢰성 제공, UDP는 비연결성/최선형 전달 프로토콜입니다." },
      { id: "q3", subject: "네트워크일반", text: "OSI 7계층에서 데이터 단위(PDU)가 'Segment'인 계층은?", options: ["응용 계층", "전송 계층", "네트워크 계층", "데이터링크 계층"], correct: 1, shortExp: "전송 계층 PDU = 세그먼트(Segment)", fullExp: "계층별 PDU: 네트워크 계층 = Packet, 데이터링크 계층 = Frame, 물리 계층 = Bit" },
      { id: "q4", subject: "NOS", text: "리눅스에서 현재 디렉토리의 파일 및 폴더 상세 목록과 숨김 파일을 확인하는 명령어는?", options: ["ls -l", "ls -a", "ls -al", "dir /w"], correct: 2, shortExp: "-a는 숨김파일 포함, -l은 상세정보 표시 ➔ ls -al", fullExp: "ls 명령어의 옵션 중 -a(all)는 점(.)으로 시작하는 숨김파일을 표시하고 -l(long)은 권한, 소유자, 크기 등 상세정보를 나타냅니다." },
      { id: "q5", subject: "네트워크기기", text: "스위칭 장비에서 루핑(Looping) 현상을 방지하기 위해 사용되는 표준 프로토콜은?", options: ["STP", "OSPF", "VRRP", "SNMP"], correct: 0, shortExp: "STP(Spanning Tree Protocol) = 스위치 루핑 방지 프로토콜", fullExp: "STP(IEEE 802.1D)는 이중화 경로가 존재하는 스위치 네트워크에서 루프를 차단하기 위해 특정 포트를 차단(Blocking) 상태로 유지합니다." },
      { id: "q6", subject: "TCP/IP", text: "IP 주소를 MAC 주소로 변환해주는 프로토콜은?", options: ["RARP", "ARP", "ICMP", "IGMP"], correct: 1, shortExp: "IP ➔ MAC 변환: ARP / MAC ➔ IP 변환: RARP", fullExp: "ARP(Address Resolution Protocol)는 논리적인 IP 주소를 물리적인 MAC 주소로 바인딩합니다." },
      { id: "q7", subject: "NOS", text: "Windows Server에서 DNS 서버의 텍스트 기반 네임 재설정 및 질의 도구로 사용하는 명령어는?", options: ["ipconfig", "nslookup", "netstat", "tracert"], correct: 1, shortExp: "DNS 질의 및 진단 도구 = nslookup", fullExp: "nslookup 도구를 통해 도메인 타겟의 IP 주소를 확인하거나 Reverse DNS 조회를 수행할 수 있습니다." },
      { id: "q8", subject: "보안", text: "사설 IP 주소를 공인 IP 주소로 변환하여 IP 부족 문제를 해결하고 내부망을 보호하는 기술은?", options: ["VLAN", "NAT", "DHCP", "VPN"], correct: 1, shortExp: "사설 IP ↔ 공인 IP 변환 = NAT (Network Address Translation)", fullExp: "NAT는 IP 주소 절약과 내부 네트워크 주소 숨김을 통한 보안 목적으로 이용됩니다." },
      { id: "q9", subject: "TCP/IP", text: "TCP의 3-Way Handshaking 과정에서 사용되는 플래그(Flag) 조합으로 옳게 짝지어진 것은?", options: ["SYN ➔ SYN+ACK ➔ ACK", "FIN ➔ FIN+ACK ➔ ACK", "RST ➔ SYN ➔ ACK", "SYN ➔ ACK ➔ SYN+ACK"], correct: 0, shortExp: "TCP 연결 수립: SYN ➔ SYN/ACK ➔ ACK", fullExp: "TCP 연결은 클라이언트의 SYN, 서버의 SYN+ACK 응답, 클라이언트의 ACK 최종 전송 3단계로 연결이 완료됩니다." },
      { id: "q10", subject: "네트워크일반", text: "가상 LAN(VLAN)을 구성하는 주된 목적과 거리가 먼 것은?", options: ["브로드캐스트 도메인 분할", "보안성 향상", "물리적 선로 비용 단순 증가", "네트워크 자원의 효율적 관리"], correct: 2, shortExp: "VLAN은 물리적 위치와 상관없이 논리적으로 그룹을 나누어 관리 효율을 높입니다.", fullExp: "VLAN은 스위치 단에서 논리적으로 브로드캐스트 도메인을 분할하여 보안과 성능을 높여줍니다." },
      { id: "q11", subject: "NOS", text: "리눅스에서 특정 파일의 접근 권한을 'rwxr-xr-x'로 변경하려 할 때 8진수 모드는?", options: ["644", "755", "777", "700"], correct: 1, shortExp: "rwx(7) r-x(5) r-x(5) ➔ 755", fullExp: "r(4)+w(2)+x(1)=7, r(4)+x(1)=5 입니다. 소유자(7), 그룹(5), 기타(5) 이므로 755입니다." },
      { id: "q12", subject: "네트워크기기", text: "OSI 7계층 중 네트워크 계층(Layer 3)에서 동작하며 최적의 경로를 지정하는 장비는?", options: ["허브(Hub)", "L2 스위치", "라우터(Router)", "리피터(Repeater)"], correct: 2, shortExp: "L3 경로 지정(라우팅) 장비 = 라우터(Router)", fullExp: "라우터는 IP 헤더의 목적지 주소를 확인하여 경로 결정(Routing) 및 패킷 포워딩을 수행합니다." },
      { id: "q13", subject: "보안", text: "송신자와 수신자가 동일한 키를 사용하여 암호화 및 복호화를 수행하는 암호화 방식은?", options: ["대칭키 암호화", "공개키 암호화", "비대칭키 암호화", "해시 알고리즘"], correct: 0, shortExp: "동일 키 사용 = 대칭키(비밀키) 암호화 (예: AES, DES)", fullExp: "대칭키 암호화는 속도가 빠르나 키 전달 및 관리의 어려움이 있고, 공개키 암호화는 암/복호화 키가 다릅니다." },
      { id: "q14", subject: "TCP/IP", text: "ICMP(Internet Control Message Protocol) 메시지 중 네트워크 연결 여부를 확인할 때 쓰는 `ping` 명령이 사용하는 타입은?", options: ["Echo Request / Echo Reply", "Destination Unreachable", "Time Exceeded", "Redirect"], correct: 0, shortExp: "ping = Echo Request(타입8) 및 Echo Reply(타입0) 사용", fullExp: "ICMP는 오류 보고 및 네트워크 상태 진단을 위해 활용됩니다." },
      { id: "q15", subject: "NOS", text: "Windows Server의 파일 시스템 중 보안성, 파일 단원별 압축, 복구 기능 및 권한 설정을 제공하는 시스템은?", options: ["FAT16", "FAT32", "NTFS", "exFAT"], correct: 2, shortExp: "Windows 표준 보안/권한 지원 파일 시스템 = NTFS", fullExp: "NTFS는 개별 파일 및 폴더에 대한 ACL(접근제어목록) 권한 설정과 암호화(EFS)를 지원합니다." }
    ];

    // === 상태 관리 변수 ===
    let state = {
      currentTab: 'home',
      currentQuestionIdx: 0,
      activeQuestions: [],
      userAnswers: {},
      timeRemaining: 1200,
      timerInterval: null,
      wrongNotes: JSON.parse(localStorage.getItem('net_wrong_notes') || '{}'),
      stats: JSON.parse(localStorage.getItem('net_stats') || '{"solved":0, "correct":0, "streak":1, "lastDate":""}')
    };

    // === 앱 초기화 ===
    window.onload = () => {
      lucide.createIcons();
      updateStreakOnLoad();
      switchTab('home');
      registerServiceWorker();
    };

    // PWA 서비스 워커 등록
    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker Registered'))
          .catch(err => console.log('SW Reg Error:', err));
      }
    }

    // === 연속 스트릭 업데이트 ===
    function updateStreakOnLoad() {
      const today = new Date().toISOString().split('T')[0];
      if (state.stats.lastDate) {
        const last = new Date(state.stats.lastDate);
        const diffDays = Math.floor((new Date(today) - last) / (1000 * 60 * 60 * 24));
        if (diffDays === 1) {
          // 연속 출석 유효
        } else if (diffDays > 1) {
          state.stats.streak = 1;
        }
      } else {
        state.stats.lastDate = today;
      }
      localStorage.setItem('net_stats', JSON.stringify(state.stats));
      document.getElementById('streak-badge').innerText = `${state.stats.streak}일 연속`;
    }

    // === 탭 전환 처리 ===
    function switchTab(tab) {
      state.currentTab = tab;
      clearInterval(state.timerInterval);
      closeExplanation();

      ['home', 'wrong', 'subject', 'dashboard'].forEach(t => {
        const nav = document.getElementById(`nav-${t}`);
        if (nav) {
          if (t === tab) nav.className = "flex flex-col items-center py-1 text-emerald-400 font-bold";
          else nav.className = "flex flex-col items-center py-1 text-slate-400";
        }
      });

      const container = document.getElementById('app-content');
      updateWrongBadge();

      if (tab === 'home') renderHomeTab(container);
      else if (tab === 'quiz') renderQuizTab(container);
      else if (tab === 'wrong') renderWrongTab(container);
      else if (tab === 'subject') renderSubjectTab(container);
      else if (tab === 'dashboard') renderDashboardTab(container);

      lucide.createIcons();
    }

    function updateWrongBadge() {
      const badge = document.getElementById('wrong-count-badge');
      const activeWrongs = Object.values(state.wrongNotes).filter(n => !n.graduated).length;
      if (activeWrongs > 0) {
        badge.innerText = activeWrongs;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // === TAB 1: 홈 (1Day 챌린지) ===
    function renderHomeTab(container) {
      container.innerHTML = `
        <div class="space-y-4">
          <div class="bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700/80 rounded-2xl p-5 relative overflow-hidden">
            <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-emerald-500/10 rounded-full blur-xl"></div>
            <span class="px-2.5 py-1 rounded-md bg-emerald-500/20 text-emerald-400 text-xs font-bold uppercase tracking-wider">Today's Goal</span>
            <h2 class="text-xl font-bold mt-2 text-white">Day 01 챌린지</h2>
            <p class="text-xs text-slate-400 mt-1">통학시간 20분 동안 15문항을 풀고 숏해설로 완성하세요.</p>
            <div class="flex items-center gap-4 mt-4 text-xs text-slate-300">
              <span class="flex items-center gap-1"><i data-lucide="help-circle" class="w-4 h-4 text-emerald-400"></i> 15문항</span>
              <span class="flex items-center gap-1"><i data-lucide="clock" class="w-4 h-4 text-cyan-400"></i> 제한시간 20분</span>
            </div>
            <button onclick="startChallenge()" class="w-full mt-5 py-3.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
              <i data-lucide="play" class="w-4 h-4 fill-current"></i> 20분 챌린지 시작하기
            </button>
          </div>
          <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-4">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">⚡ Quick Stats</h3>
            <div class="grid grid-cols-2 gap-3 text-center">
              <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-800">
                <div class="text-xs text-slate-400">복습 필요 오답</div>
                <div class="text-lg font-bold text-rose-400 mt-0.5">${Object.values(state.wrongNotes).filter(n => !n.graduated).length}개</div>
              </div>
              <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-800">
                <div class="text-xs text-slate-400">누적 풀이 문항</div>
                <div class="text-lg font-bold text-emerald-400 mt-0.5">${state.stats.solved}개</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function startChallenge() {
      state.activeQuestions = [...sampleQuestions];
      state.currentQuestionIdx = 0;
      state.userAnswers = {};
      state.timeRemaining = 1200;
      switchTab('quiz');
      startTimer();
    }

    // === 타이머 ===
    function startTimer() {
      clearInterval(state.timerInterval);
      state.timerInterval = setInterval(() => {
        state.timeRemaining--;
        const timerEl = document.getElementById('quiz-timer');
        if (timerEl) {
          const m = String(Math.floor(state.timeRemaining / 60)).padStart(2, '0');
          const s = String(state.timeRemaining % 60).padStart(2, '0');
          timerEl.innerText = `${m}:${s}`;
        }
        if (state.timeRemaining <= 0) {
          clearInterval(state.timerInterval);
          alert('제한시간 20분이 종료되었습니다!');
          finishQuiz();
        }
      }, 1000);
    }

    // === TAB 2: 퀴즈 풀이 ===
    function renderQuizTab(container) {
      const q = state.activeQuestions[state.currentQuestionIdx];
      const progressPct = ((state.currentQuestionIdx + 1) / state.activeQuestions.length) * 100;
      const isAnswered = state.userAnswers[q.id] !== undefined;

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between text-xs">
            <span class="font-bold text-slate-400">Q${state.currentQuestionIdx + 1} / ${state.activeQuestions.length}</span>
            <span class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-emerald-400 font-mono" id="quiz-timer">20:00</span>
          </div>
          <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
            <div class="bg-emerald-500 h-full transition-all duration-300" style="width: ${progressPct}%"></div>
          </div>
          <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-5">
            <span class="inline-block px-2 py-0.5 text-[10px] font-bold rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 mb-2">${q.subject}</span>
            <h3 class="text-sm font-semibold text-slate-100 leading-relaxed">${q.text}</h3>
          </div>
          <div class="space-y-2.5">
            ${q.options.map((opt, idx) => {
              let btnStyle = "bg-slate-800/60 border-slate-700/80 text-slate-200 hover:border-slate-600";
              if (isAnswered) {
                if (idx === q.correct) btnStyle = "bg-emerald-500/20 border-emerald-500 text-emerald-300 font-bold";
                else if (state.userAnswers[q.id] === idx) btnStyle = "bg-rose-500/20 border-rose-500 text-rose-300";
                else btnStyle = "bg-slate-800/30 border-slate-800 text-slate-500 opacity-60";
              }
              return `
                <button onclick="selectAnswer(${idx})" ${isAnswered ? 'disabled' : ''} class="w-full p-3.5 text-left text-xs rounded-xl border transition-all flex items-center justify-between ${btnStyle}">
                  <span><strong class="mr-2">${idx + 1}.</strong> ${opt}</span>${isAnswered && idx === q.correct ? '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>' : ''}
                  ${isAnswered && state.userAnswers[q.id] === idx && idx !== q.correct ? '<i data-lucide="x-circle" class="w-4 h-4 text-rose-400"></i>' : ''}
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function selectAnswer(optIdx) {
      const q = state.activeQuestions[state.currentQuestionIdx];
      const isCorrect = optIdx === q.correct;
      state.userAnswers[q.id] = optIdx;

      // 오답노트 & 통계 처리
      if (!isCorrect) {
        state.wrongNotes[q.id] = {
          question: q,
          consecutiveCorrect: 0,
          graduated: false
        };
      } else if (state.wrongNotes[q.id]) {
        state.wrongNotes[q.id].consecutiveCorrect++;
        if (state.wrongNotes[q.id].consecutiveCorrect >= 3) {
          state.wrongNotes[q.id].graduated = true;
        }
      }
      localStorage.setItem('net_wrong_notes', JSON.stringify(state.wrongNotes));

      state.stats.solved++;
      if (isCorrect) state.stats.correct++;
      const today = new Date().toISOString().split('T')[0];
      state.stats.lastDate = today;
      localStorage.setItem('net_stats', JSON.stringify(state.stats));

      renderQuizTab(document.getElementById('app-content'));
      openExplanation(isCorrect, q);
    }

    function openExplanation(isCorrect, question) {
      const sheet = document.getElementById('explanation-sheet');
      const badge = document.getElementById('sheet-result-badge');
      document.getElementById('sheet-short-exp').innerText = question.shortExp;
      document.getElementById('sheet-full-exp').innerText = question.fullExp;

      if (isCorrect) {
        badge.innerText = "정답입니다! 🎉";
        badge.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
      } else {
        badge.innerText = "오답입니다 😅";
        badge.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30";
      }

      sheet.classList.remove('hidden-sheet');
      sheet.classList.add('show-sheet');
      lucide.createIcons();
    }

    function closeExplanation() {
      const sheet = document.getElementById('explanation-sheet');
      sheet.classList.remove('show-sheet');
      sheet.classList.add('hidden-sheet');
    }

    function nextQuestion() {
      closeExplanation();
      if (state.currentQuestionIdx < state.activeQuestions.length - 1) {
        state.currentQuestionIdx++;
        renderQuizTab(document.getElementById('app-content'));
        lucide.createIcons();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      clearInterval(state.timerInterval);
      const container = document.getElementById('app-content');
      const total = state.activeQuestions.length;
      let correctCount = 0;
      state.activeQuestions.forEach(q => {
        if (state.userAnswers[q.id] === q.correct) correctCount++;
      });
      const score = Math.round((correctCount / total) * 100);
      const isPass = score >= 60;

      container.innerHTML = `
        <div class="text-center py-6 space-y-4">
          <div class="w-16 h-16 ${isPass ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border-rose-500/30'} border rounded-full flex items-center justify-center mx-auto">
            <i data-lucide="${isPass ? 'award' : 'alert-circle'}" class="w-8 h-8"></i>
          </div>
          <div>
            <span class="text-xs font-bold uppercase tracking-widest text-slate-400">1Day Challenge Complete</span>
            <h2 class="text-2xl font-extrabold text-white mt-1">${score}점</h2>
            <p class="text-xs ${isPass ? 'text-emerald-400' : 'text-rose-400'} font-semibold mt-1">
              ${isPass ? '합격권입니다! 통학시간을 완벽히 활용하셨어요.' : '아쉽습니다. 오답노트를 복습해보세요!'}
            </p>
          </div>
          <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-4 grid grid-cols-2 gap-3 text-xs text-slate-300">
            <div>맞힌 문제: <strong class="text-emerald-400">${correctCount} / ${total}</strong></div>
            <div>소요시간: <strong class="text-cyan-400">${Math.floor((1200 - state.timeRemaining) / 60)}분 ${ (1200 - state.timeRemaining) % 60 }초</strong></div>
          </div>
          <button onclick="switchTab('home')" class="w-full py-3 bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 font-bold rounded-xl">
            메인 화면으로 이동
          </button>
        </div>
      `;
      lucide.createIcons();
    }

    // === TAB 3: 오답노트 ===
    function renderWrongTab(container) {
      const wrongs = Object.values(state.wrongNotes).filter(n => !n.graduated);

      if (wrongs.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 space-y-3">
            <div class="w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center mx-auto">
              <i data-lucide="check-circle-2" class="w-6 h-6"></i>
            </div>
            <h3 class="text-sm font-bold text-slate-200">복습할 오답이 없습니다!</h3>
            <p class="text-xs text-slate-400">모든 오답을 졸업하셨거나 문제를 틀린 적이 없습니다.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-bold text-slate-200">오답 복습 (${wrongs.length}개)</h3>
            <span class="text-[10px] text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">🎓 3회 연속 정답 시 졸업</span>
          </div>
          <div class="space-y-3">
            ${wrongs.map(w => `
              <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4 space-y-2">
                <div class="flex items-center justify-between text-[11px]">
                  <span class="text-cyan-400 font-bold">${w.question.subject}</span>
                  <span class="text-slate-400">연속 정답: <strong class="text-emerald-400">${w.consecutiveCorrect}/3</strong></span>
                </div>
                <p class="text-xs text-slate-200 font-medium">${w.question.text}</p>
                <div class="text-[11px] text-emerald-400/90 bg-slate-900/60 p-2.5 rounded border border-slate-800">
                  💡 ${w.question.shortExp}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // === TAB 4: 과목별 학습 ===
    function renderSubjectTab(container) {
      const subjects = ["TCP/IP", "네트워크일반", "NOS", "네트워크기기", "보안"];
      container.innerHTML = `
        <div class="space-y-4">
          <h3 class="text-sm font-bold text-slate-200">과목별 집중 모드</h3>
          <div class="grid grid-cols-1 gap-2.5">
            ${subjects.map(subj => {
              const count = sampleQuestions.filter(q => q.subject.includes(subj) || subj.includes(q.subject)).length;
              return `
                <button onclick="startSubjectQuiz('${subj}')" class="p-4 bg-slate-800/60 border border-slate-700/60 rounded-xl flex items-center justify-between hover:border-emerald-500/50 transition">
                  <div class="text-left">
                    <div class="text-xs font-bold text-slate-100">${subj}</div>
                    <div class="text-[10px] text-slate-400 mt-0.5">총 ${count}문항 등록됨</div>
                  </div>
                  <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function startSubjectQuiz(subj) {
      state.activeQuestions = sampleQuestions.filter(q => q.subject.includes(subj) || subj.includes(q.subject));
      if (state.activeQuestions.length === 0) {
        alert('해당 과목 문제 풀 준비 중입니다.');
        return;
      }
      state.currentQuestionIdx = 0;
      state.userAnswers = {};
      state.timeRemaining = state.activeQuestions.length * 80;
      switchTab('quiz');
      startTimer();
    }

    // === TAB 5: 대시보드 ===
    function renderDashboardTab(container) {
      const accuracy = state.stats.solved > 0 ? Math.round((state.stats.correct / state.stats.solved) * 100) : 0;
      const passEst = accuracy >= 60 ? "합격 유력 (상위 20%)" : "복습 필요 (합격선 미달)";

      container.innerHTML = `
        <div class="space-y-4">
          <h3 class="text-sm font-bold text-slate-200">학습 대시보드</h3>
          <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4 space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-xs text-slate-400">평균 정답률</div>
                <div class="text-2xl font-extrabold text-emerald-400 mt-0.5">${accuracy}%</div>
              </div>
              <div class="text-right">
                <div class="text-xs text-slate-400">합격 가능성</div>
                <div class="text-xs font-bold ${accuracy >= 60 ? 'text-emerald-400' : 'text-rose-400'} mt-1">${passEst}</div>
              </div>
            </div>
            <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden relative">
              <div class="absolute left-[60%] top-0 bottom-0 w-0.5 bg-amber-400 z-10" title="합격선 60%"></div>
              <div class="bg-emerald-500 h-full" style="width: ${accuracy}%"></div>
            </div>
            <div class="text-[10px] text-slate-400 flex justify-between">
              <span>0%</span>
              <span class="text-amber-400 font-bold">합격 커트라인 (60%)</span>
              <span>100%</span>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-xl text-center">
              <i data-lucide="flame" class="w-5 h-5 text-amber-400 mx-auto mb-1"></i>
              <div class="text-xs text-slate-400">통학 연속 학습</div>
              <div class="text-lg font-bold text-white mt-1">${state.stats.streak}일째</div>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-xl text-center">
              <i data-lucide="check-square" class="w-5 h-5 text-cyan-400 mx-auto mb-1"></i>
              <div class="text-xs text-slate-400">누적 문제 풀이</div>
              <div class="text-lg font-bold text-white mt-1">${state.stats.solved}개</div>
            </div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
